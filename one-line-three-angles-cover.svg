<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F0"/><stop offset="100%" stop-color="#E1EBDF"/>
    </linearGradient>
    <radialGradient id="lglow" cx="40%" cy="62%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="640" height="400" fill="url(#lbg)"/>
  <g stroke="#D6E5D2" stroke-width="0.6" opacity="0.5">
    <line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/><line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="160" x2="640" y2="160"/><line x1="0" y1="200" x2="640" y2="200"/><line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="280" x2="640" y2="280"/><line x1="0" y1="320" x2="640" y2="320"/><line x1="0" y1="360" x2="640" y2="360"/><line x1="0" y1="400" x2="640" y2="400"/>
  </g>
  <ellipse cx="250" cy="240" rx="240" ry="180" fill="url(#lglow)"/>

  <!-- 直线 l -->
  <line x1="38.0" y1="318.0" x2="426.0" y2="318.0" stroke="#93A894" stroke-width="2.6" stroke-linecap="round"/>

  <!-- △ABP -->
  <polygon points="72.0,129.0 72.0,318.0 207.0,318.0" fill="rgba(91,140,90,0.13)" stroke="#5B8C5A" stroke-width="1.9"/>
  <!-- △PCD -->
  <polygon points="207.0,318.0 396.0,318.0 396.0,183.0" fill="rgba(197,169,106,0.18)" stroke="#C5A96A" stroke-width="1.9"/>

  <!-- 三个直角标记 -->
  <g stroke="#D1495B" stroke-width="1.9" stroke-linejoin="round">
    <polyline points="72.0,303.0 87.0,303.0 87.0,318.0" fill="none"/>
    <polyline points="198.3,305.8 210.5,297.1 219.2,309.3" fill="none"/>
    <polyline points="381.0,318.0 381.0,303.0 396.0,303.0" fill="none"/>
  </g>

  <!-- 等长对 AB = PC -->
  <line x1="72.0" y1="318.0" x2="72.0" y2="129.0" stroke="#B32D42" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="207.0" y1="318.0" x2="396.0" y2="318.0" stroke="#B32D42" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 顶点 -->
  <g fill="#FFFFFF" stroke-width="2">
    <circle cx="72.0" cy="129.0" r="4.4" stroke="#5B8C5A"/>
    <circle cx="72.0" cy="318.0" r="4.4" stroke="#2D4A32"/>
    <circle cx="207.0" cy="318.0" r="4.4" stroke="#2D4A32"/>
    <circle cx="396.0" cy="318.0" r="4.4" stroke="#2D4A32"/>
    <circle cx="396.0" cy="183.0" r="4.4" stroke="#C5A96A"/>
  </g>
  <g font-family="Times New Roman, Songti SC, Georgia, serif" font-size="16" font-weight="700" font-style="italic">
    <text x="56.0" y="133.0" fill="#5B8C5A">A</text>
    <text x="54.0" y="338.0" fill="#2D4A32">B</text>
    <text x="201.0" y="340.0" fill="#2D4A32">P</text>
    <text x="404.0" y="340.0" fill="#2D4A32">C</text>
    <text x="408.0" y="177.0" fill="#C5A96A">D</text>
  </g>

  <g font-family="Noto Serif SC, Songti SC, SimSun, serif">
    <text x="424" y="146" font-size="29" font-weight="700" fill="#2D4A32" letter-spacing="2">一线三等角</text>
    <text x="426" y="178" font-size="13.5" fill="#6B7D6C" letter-spacing="0.5">共线的三个等角 · 八年级</text>
    <text x="426" y="214" font-size="16" font-weight="700" fill="#B32D42">&#9651;ABP &#8764; &#9651;PCD</text>
    <text x="426" y="242" font-size="12.5" fill="#9AAB9B">AA 相似 · AB = PC 时全等</text>
  </g>
  <line x1="426" y1="128" x2="586" y2="128" stroke="#D1495B" stroke-width="2.6" stroke-linecap="round"/>
</svg>
