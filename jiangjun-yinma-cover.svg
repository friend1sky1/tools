<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="lbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F0"/><stop offset="100%" stop-color="#E1EBDF"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E4F0F6"/><stop offset="100%" stop-color="#D2E5EF"/>
    </linearGradient>
    <radialGradient id="lglow" cx="38%" cy="58%" r="62%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/><stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#lbg)"/>
  <g stroke="#D6E5D2" stroke-width="0.6" opacity="0.45">
    <line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/>
    <line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="160" x2="640" y2="160"/>
    <line x1="0" y1="200" x2="640" y2="200"/><line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="280" x2="640" y2="280"/><line x1="0" y1="320" x2="640" y2="320"/>
    <line x1="0" y1="360" x2="640" y2="360"/>
  </g>
  <ellipse cx="230" cy="230" rx="240" ry="170" fill="url(#lglow)"/>

  <!-- 河 -->
  <rect x="24" y="239" width="392" height="22" fill="url(#water)"/>
  <line x1="24" y1="239" x2="416" y2="239" stroke="#8FB4C8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="24" y1="261" x2="416" y2="261" stroke="#8FB4C8" stroke-width="1.8" stroke-linecap="round"/>
  <g stroke="#A8C5D6" stroke-width="1.4" fill="none" stroke-linecap="round">
    <path d="M60 250 q8 -6 16 0"/><path d="M140 250 q8 -6 16 0"/><path d="M220 250 q8 -6 16 0"/>
    <path d="M300 250 q8 -6 16 0"/><path d="M370 250 q8 -6 16 0"/>
  </g>
  <text x="28" y="232" font-family="Noto Serif SC, Songti SC, SimSun, serif" font-size="12" fill="#8FB4C8">河岸 l</text>

  <!-- 辅助线：A → A′ 与 A′ → B -->
  <line x1="108" y1="134" x2="108" y2="366" stroke="#4E6E8E" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="108" y1="366" x2="344" y2="172" stroke="#4E6E8E" stroke-width="1.6" stroke-dasharray="6 5"/>
  <rect x="108" y="239" width="10" height="10" fill="none" stroke="#4E6E8E" stroke-width="1.3"/>

  <!-- 当前路线 A → P → B -->
  <polyline points="108,134 198,250 344,172" fill="none" stroke="#E08A3C" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 最优点 -->
  <circle cx="249" cy="250" r="6.5" fill="#FFFFFF" stroke="#5B8C5A" stroke-width="2.6"/>

  <!-- 顶点 -->
  <circle cx="108" cy="134" r="6" fill="#FFFFFF" stroke="#2D4A32" stroke-width="2.4"/>
  <circle cx="344" cy="172" r="6" fill="#FFFFFF" stroke="#B32D42" stroke-width="2.4"/>
  <circle cx="108" cy="366" r="5.4" fill="#FFFFFF" stroke="#4E6E8E" stroke-width="2.2"/>
  <circle cx="198" cy="250" r="6" fill="#E08A3C" stroke="#FFFFFF" stroke-width="2"/>

  <g font-family="Times New Roman, Songti SC, Georgia, serif" font-size="15" font-weight="700" font-style="italic">
    <text x="88" y="126" fill="#2D4A32">A</text>
    <text x="352" y="164" fill="#B32D42">B</text>
    <text x="86" y="386" fill="#4E6E8E">A′</text>
    <text x="260" y="234" fill="#5B8C5A">P*</text>
    <text x="188" y="274" fill="#C46A1F">P</text>
  </g>

  <g font-family="Noto Serif SC, Songti SC, SimSun, serif">
    <text x="436" y="140" font-size="28" font-weight="700" fill="#2D4A32" letter-spacing="3">将军饮马</text>
    <text x="438" y="170" font-size="13" fill="#6B7D6C" letter-spacing="0.5">轴对称 · 最短路径 · 八年级</text>
    <text x="438" y="206" font-size="14.5" font-weight="700" fill="#B32D42">AP + PB 最小</text>
    <text x="438" y="230" font-size="13" fill="#5B8C5A">= A′B（三点共线时取到）</text>
    <text x="438" y="262" font-size="11.5" fill="#9AAB9B">作对称点 → 连成直线 → 交点即最优</text>
  </g>
</svg>
