<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="hbg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2F7F0"/>
      <stop offset="100%" stop-color="#E1EBDF"/>
    </linearGradient>
    <radialGradient id="hglow" cx="42%" cy="60%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="640" height="400" fill="url(#hbg)"/>
  <g stroke="#D6E5D2" stroke-width="0.6" opacity="0.55">
    <line x1="40" y1="0" x2="40" y2="400"/><line x1="80" y1="0" x2="80" y2="400"/><line x1="120" y1="0" x2="120" y2="400"/><line x1="160" y1="0" x2="160" y2="400"/><line x1="200" y1="0" x2="200" y2="400"/><line x1="240" y1="0" x2="240" y2="400"/><line x1="280" y1="0" x2="280" y2="400"/><line x1="320" y1="0" x2="320" y2="400"/><line x1="360" y1="0" x2="360" y2="400"/><line x1="400" y1="0" x2="400" y2="400"/><line x1="440" y1="0" x2="440" y2="400"/><line x1="480" y1="0" x2="480" y2="400"/><line x1="520" y1="0" x2="520" y2="400"/><line x1="560" y1="0" x2="560" y2="400"/><line x1="600" y1="0" x2="600" y2="400"/><line x1="640" y1="0" x2="640" y2="400"/>
    <line x1="0" y1="40" x2="640" y2="40"/><line x1="0" y1="80" x2="640" y2="80"/><line x1="0" y1="120" x2="640" y2="120"/><line x1="0" y1="160" x2="640" y2="160"/><line x1="0" y1="200" x2="640" y2="200"/><line x1="0" y1="240" x2="640" y2="240"/><line x1="0" y1="280" x2="640" y2="280"/><line x1="0" y1="320" x2="640" y2="320"/><line x1="0" y1="360" x2="640" y2="360"/><line x1="0" y1="400" x2="640" y2="400"/>
  </g>
  <ellipse cx="270" cy="250" rx="230" ry="180" fill="url(#hglow)"/>

  <!-- 两个原始等腰三角形 -->
  <polygon points="252,300 411.5,225.6 267.3,124.7" fill="rgba(91,140,90,0.08)" stroke="#9CBB98" stroke-width="1.4" stroke-dasharray="7 6"/>
  <polygon points="252,300 150.9,215.2 128.0,345.1" fill="rgba(197,169,106,0.13)" stroke="#C9B183" stroke-width="1.4" stroke-dasharray="7 6"/>

  <!-- 两个全等三角形 -->
  <polygon points="252,300 411.5,225.6 150.9,215.2" fill="rgba(209,73,91,0.17)" stroke="#D1495B" stroke-width="1.7"/>
  <polygon points="252,300 267.3,124.7 128.0,345.1" fill="rgba(209,73,91,0.17)" stroke="#D1495B" stroke-width="1.7"/>

  <!-- 手拉手两条线 -->
  <line x1="411.5" y1="225.6" x2="150.9" y2="215.2" stroke="#B32D42" stroke-width="3.4" stroke-linecap="round"/>
  <line x1="267.3" y1="124.7" x2="128.0" y2="345.1" stroke="#B32D42" stroke-width="3.4" stroke-linecap="round"/>

  <!-- 顶点 -->
  <g fill="#FFFFFF" stroke-width="2">
    <circle cx="252" cy="300" r="4.6" stroke="#5B8C5A"/>
    <circle cx="411.5" cy="225.6" r="4" stroke="#5B8C5A"/>
    <circle cx="267.3" cy="124.7" r="4" stroke="#5B8C5A"/>
    <circle cx="150.9" cy="215.2" r="4" stroke="#C5A96A"/>
    <circle cx="128.0" cy="345.1" r="4" stroke="#C5A96A"/>
    <circle cx="208.6" cy="217.5" r="3.6" stroke="#B32D42"/>
  </g>

  <g font-family="Times New Roman, Songti SC, Georgia, serif" font-size="15" font-weight="700" font-style="italic">
    <text x="268" y="318" fill="#5B8C5A">O</text>
    <text x="424.5" y="219.6" fill="#5B8C5A">A</text>
    <text x="251.3" y="118.7" fill="#5B8C5A">B</text>
    <text x="146.9" y="201.2" fill="#C5A96A">C</text>
    <text x="122.0" y="365.1" fill="#C5A96A">D</text>
    <text x="218.6" y="207.5" fill="#B32D42">E</text>
  </g>

  <!-- 文字 -->
  <g font-family="Noto Serif SC, Songti SC, SimSun, serif">
    <text x="424" y="150" font-size="29" font-weight="700" fill="#2D4A32" letter-spacing="2">手拉手模型</text>
    <text x="426" y="182" font-size="13.5" fill="#6B7D6C" letter-spacing="1">共顶点的两个等腰三角形</text>
    <text x="426" y="216" font-size="16" font-weight="700" fill="#B32D42" letter-spacing="0.5">&#9651;OAC &#8773; &#9651;OBD</text>
    <text x="426" y="244" font-size="12.5" fill="#9AAB9B">SAS &#183; AC = BD &#183; &#8736;AEB = &#945;</text>
  </g>
  <g stroke="#D1495B" stroke-width="2.6" stroke-linecap="round">
    <line x1="426" y1="132" x2="586" y2="132"/>
  </g>
</svg>
